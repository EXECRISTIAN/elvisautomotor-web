# Elvis Automotores — versión local completa (sitio + panel + base de datos con datos de ejemplo).
# Uso:  docker compose up --build      y luego abrir http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: elvis
      POSTGRES_PASSWORD: elvis-local
      POSTGRES_DB: elvis
    volumes:
      - elvis-db:/var/lib/postgresql/data
      # Solo se cargan la primera vez (base vacía): datos de ejemplo de Elvis.
      - ./deploy/local:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elvis -d elvis"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://elvis:elvis-local@db:5432/elvis
      SESSION_SECRET: cambiar-esta-clave-larga-para-uso-local-0123456789
      # Sin almacenamiento de fotos local: subir fotos nuevas requiere un bucket S3 (ver docs/elvis/PC-LOCAL.md).
      S3_BUCKET_NAME: local
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
      S3_ENDPOINT: http://localhost:9
      HIDE_OPENFRONT_BRANDING: "true"
volumes:
  elvis-db:
