<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui;width:270px;padding:12px;margin:0}
button{width:100%;padding:10px;font-size:15px;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-top:6px}
#go{background:#1a73e8}#rec{background:#d93025}#rec.on{background:#444}button:disabled{opacity:.6}
label{display:block;margin:6px 0}#s,#rs{margin-top:8px;font-size:12px;color:#444;white-space:pre-wrap}hr{border:0;border-top:1px solid #ddd;margin:14px 0}
</style></head><body>
<h3 style="margin:0 0 8px">Guardar Offline</h3>
<label><input type="checkbox" id="noJs" checked> Quitar scripts (recomendado)</label>
<label><input type="checkbox" id="scroll" checked> Scroll para cargar imágenes lazy</label>
<button id="go">Guardar esta página</button><div id="s"></div>
<hr>
<b>Grabar navegación</b>
<div style="font-size:12px;color:#555;margin-top:4px">Guarda esta página y cada página que visites desde esta pestaña hasta que toques Stop.</div>
<label><input type="checkbox" id="files" checked> Imágenes y fuentes como archivos separados (para reutilizar en otra web)</label>
<button id="rec">● Iniciar grabación</button><div id="rs"></div>
<script src="popup.js"></script></body></html>
