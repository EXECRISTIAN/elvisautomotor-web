<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui;width:290px;padding:12px;margin:0}
button{width:100%;padding:10px;font-size:15px;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-top:6px}
#go{background:#1a73e8}#rec{background:#d93025}#rec.on{background:#444}button:disabled{opacity:.6}
label{display:block;margin:6px 0;font-size:13px}#s,#rs{margin-top:8px;font-size:12px;color:#444;white-space:pre-wrap}hr{border:0;border-top:1px solid #ddd;margin:14px 0}
.hint{font-size:12px;color:#555;margin-top:4px}
</style></head><body>
<h3 style="margin:0 0 8px">Guardar Offline</h3>
<b>Grabar todo</b>
<div class="hint">Desde que tocás Iniciar se guarda esta pestaña y todas las que abras, con cada página que visites, hasta que toques Stop.</div>
<label><input type="checkbox" id="full" checked> Copia completa del código original (HTML, JS, CSS, JSON, imágenes, fuentes, videos…). Recarga la página al iniciar y Chrome muestra un aviso de “depuración”: es normal.</label>
<label><input type="checkbox" id="files" checked> CSS, imágenes y fuentes como archivos separados</label>
<button id="rec">● Iniciar grabación</button><div id="rs"></div>
<hr>
<b>Solo esta página</b>
<label><input type="checkbox" id="noJs" checked> Quitar scripts (recomendado)</label>
<button id="go">Guardar esta página</button><div id="s"></div>
<script src="popup.js"></script></body></html>
